services:
  postgres:
    image: postgres:16-alpine
    container_name: sudoku-trainer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sudoku
      POSTGRES_PASSWORD: sudoku
      POSTGRES_DB: sudoku_trainer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudoku -d sudoku_trainer"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
